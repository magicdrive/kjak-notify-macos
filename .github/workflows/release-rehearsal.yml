name: Release rehearsal

# Exercises the release path against the real GitHub API without publishing
# anything: the same CI gate, read-only build job and separate publishing
# job as release.yml, with hephaestus.rehearsal.yaml, which keeps the
# release a draft (no tag is created, nothing is public) and opens the
# formula pull request on the sandbox tap magicdrive/homebrew-tap-sandbox.
# Each publishing stage runs twice: the second run must change nothing
# (no new asset, no new tap commit). Provenance attestation is not
# rehearsed: it writes a public transparency log entry.
#
# Clean up afterwards (the summary prints the commands): delete the draft
# release, and close the sandbox pull request and delete its branch.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Rehearsal version without "v", e.g. 0.1.0-rehearsal.1
        required: true

permissions:
  contents: read

concurrency:
  group: release-rehearsal
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the rehearsal version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rehearsal\.[0-9]+$ ]] || {
            echo "::error::version must look like 0.1.0-rehearsal.1"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build, archive and checksum
        uses: magicdrive/hephaestus@0f76752ad2a6598ba8fc6978eb90a790c71c4835 # v1.5.0
        with:
          command: run
          config: hephaestus.rehearsal.yaml
          stages: build,archive,checksum
          fresh: "true"
          tag: v${{ inputs.version }}
          github-token: ""
      - name: Verify dist
        run: scripts/verify-dist.sh dist "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  rehearse:
    needs: [ci, build]
    runs-on: ubuntu-24.04
    environment: release-rehearsal
    permissions:
      contents: write # create and fill the draft release
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify dist again
        run: scripts/verify-dist.sh dist "$VERSION"
      - name: Check the sandbox tap token
        env:
          HOMEBREW_TAP_SANDBOX_TOKEN: ${{ secrets.HOMEBREW_TAP_SANDBOX_TOKEN }}
        run: |
          [[ -n "$HOMEBREW_TAP_SANDBOX_TOKEN" ]] || { echo "::error::HOMEBREW_TAP_SANDBOX_TOKEN is not set in the release-rehearsal environment"; exit 1; }
      - name: Draft release
        id: release1
        uses: magicdrive/hephaestus@0f76752ad2a6598ba8fc6978eb90a790c71c4835 # v1.5.0
        with:
          command: release
          config: hephaestus.rehearsal.yaml
          tag: v${{ inputs.version }}
          github-token: ${{ github.token }}
      - name: Draft release again (must upload nothing)
        id: release2
        uses: magicdrive/hephaestus@0f76752ad2a6598ba8fc6978eb90a790c71c4835 # v1.5.0
        with:
          command: release
          config: hephaestus.rehearsal.yaml
          tag: v${{ inputs.version }}
          github-token: ${{ github.token }}
      - name: Formula and sandbox tap pull request
        id: tap1
        uses: magicdrive/hephaestus@0f76752ad2a6598ba8fc6978eb90a790c71c4835 # v1.5.0
        with:
          command: run
          config: hephaestus.rehearsal.yaml
          stages: formula,tap
          tag: v${{ inputs.version }}
          github-token: ""
          # Fine-grained token with contents and pull-requests write on the
          # sandbox tap only, stored in the release-rehearsal environment
          # under its own name: a missing one never falls back to the
          # production tap token.
          tap-token: ${{ secrets.HOMEBREW_TAP_SANDBOX_TOKEN }}
      - name: Formula and sandbox tap again (must write nothing)
        id: tap2
        uses: magicdrive/hephaestus@0f76752ad2a6598ba8fc6978eb90a790c71c4835 # v1.5.0
        with:
          command: run
          config: hephaestus.rehearsal.yaml
          stages: formula,tap
          tag: v${{ inputs.version }}
          github-token: ""
          tap-token: ${{ secrets.HOMEBREW_TAP_SANDBOX_TOKEN }}
      - name: The second runs were no-ops
        env:
          R1: ${{ steps.release1.outputs.status }}
          R2: ${{ steps.release2.outputs.status }}
          R2_UPLOADED: ${{ steps.release2.outputs.uploaded-assets }}
          T1: ${{ steps.tap1.outputs.status }}
          T2: ${{ steps.tap2.outputs.status }}
          T2_NOOP: ${{ steps.tap2.outputs.no-op }}
          T2_COMMITS: ${{ steps.tap2.outputs.formula-commit-sha }}
          PR: ${{ steps.tap1.outputs.pull-request-url }}
        run: |
          echo "release: $R1 then $R2 (uploaded: ${R2_UPLOADED:-none}); tap: $T1 then $T2 (no-op: $T2_NOOP); $PR"
          [[ "$R2" == no-op && "$T2" == no-op && "$T2_NOOP" == true ]]
          # a run that uploads nothing reports null (a nil list)
          case "$R2_UPLOADED" in ""|"[]"|null) ;; *) echo "::error::uploaded again: $R2_UPLOADED"; exit 1 ;; esac
          [[ -z "$T2_COMMITS" ]]
      - name: Cleanup commands
        if: always()
        run: |
          {
            echo "### Clean up the rehearsal"
            echo '```sh'
            echo "gh release delete v$VERSION --repo $GITHUB_REPOSITORY --yes"
            echo "gh pr close kjak-notify-macos-$VERSION --repo magicdrive/homebrew-tap-sandbox --delete-branch"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
