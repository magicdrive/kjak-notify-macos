name: Release

# On a v* tag: the full CI at the tagged commit, the tag's provenance, a
# read-only build of the archives and checksum with Hephaestus, then one
# publishing job: the GitHub Release and, for a stable version only, the
# formula pull request on magicdrive/homebrew-tap. A prerelease tag
# (v0.1.0-rc.1) publishes a prerelease and never touches the tap: the plan
# skips the tap steps, so they never receive the tap token, and
# brews.skip_upload: auto skips the tap stage as well. docs/release.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # PROVENANCE: a tag's commit must be in the history of main: a v* tag
  # pushed on any other commit builds and publishes nothing. The script
  # fetches the tag and the branch afresh, requires the tag to name this
  # run's commit and fails closed on anything it cannot establish
  # (.github/release/verify-tag-provenance.sh, from Hephaestus).
  provenance:
    needs: [ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag is on main
        run: .github/release/verify-tag-provenance.sh --ref "$GITHUB_REF" --sha "$GITHUB_SHA" main

  ci:
    # The full CI, at the tagged commit, is the release gate.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    # Builds, packages and verifies the release with read-only permissions
    # and no token: only the verified dist/ moves on.
    needs: [ci, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No module cache: the build reads nothing a previous run wrote.
          cache: false
      - name: Check the release tag
        # Rejects a tag that is not vMAJOR.MINOR.PATCH[-PRERELEASE] before
        # anything is built.
        uses: magicdrive/hephaestus@0f76752ad2a6598ba8fc6978eb90a790c71c4835 # v1.5.0
        with:
          command: plan
          github-token: ""
      - name: Build, archive and checksum
        uses: magicdrive/hephaestus@0f76752ad2a6598ba8fc6978eb90a790c71c4835 # v1.5.0
        with:
          command: run
          stages: build,archive,checksum
          fresh: "true"
          github-token: ""
      - name: Verify dist
        run: scripts/verify-dist.sh dist "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    # Publishes the verified dist/ of the build job. No build command runs
    # here.
    needs: [provenance, ci, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write     # create the release and upload assets
      id-token: write     # sign provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify dist again before publishing anything
        run: scripts/verify-dist.sh dist "${GITHUB_REF_NAME#v}"
      - name: Plan the release
        # Whether this tag is a prerelease and whether the tap is published
        # (skip_upload), decided by Hephaestus (hephaestus publish plan),
        # not by matching the tag here. The action fails a prerelease whose
        # plan would update the tap.
        id: plan
        uses: magicdrive/hephaestus@0f76752ad2a6598ba8fc6978eb90a790c71c4835 # v1.5.0
        with:
          command: plan
          github-token: ""
      - name: Check the plan
        env:
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
          TAP: ${{ steps.plan.outputs.tap }}
        run: |
          echo "prerelease=$PRERELEASE tap=$TAP"
          # An unexpected plan would skip both tap steps without failing.
          [[ "$TAP" == publish || "$TAP" == skip ]] || { echo "::error::unexpected release plan"; exit 1; }
          # This repository never publishes a prerelease to the tap.
          if [[ "$PRERELEASE" != false && "$TAP" != skip ]]; then
            echo "::error::a prerelease must not update the tap (brews.skip_upload: auto)"; exit 1
          fi
      - name: Rehearse the formula and tap pull request (read-only)
        # Checks the tap token, the tap's formula directory, a newer formula
        # on the tap and the pull request branch before the release becomes
        # public, since a published release cannot be taken back.
        if: steps.plan.outputs.tap == 'publish'
        uses: magicdrive/hephaestus@0f76752ad2a6598ba8fc6978eb90a790c71c4835 # v1.5.0
        with:
          command: run
          stages: formula,tap
          dry-run: "true"
          github-token: ""
          tap-token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kjak-notify-macos_*.tar.gz
            dist/kjak-notify-macos_checksums.txt
      - name: Publish the GitHub release
        uses: magicdrive/hephaestus@0f76752ad2a6598ba8fc6978eb90a790c71c4835 # v1.5.0
        with:
          command: release
          github-token: ${{ github.token }}
      - name: Generate the formula and open a tap pull request
        if: steps.plan.outputs.tap == 'publish'
        uses: magicdrive/hephaestus@0f76752ad2a6598ba8fc6978eb90a790c71c4835 # v1.5.0
        with:
          command: run
          stages: formula,tap
          github-token: ""
          # Fine-grained token or GitHub App token with contents and
          # pull-requests write on magicdrive/homebrew-tap only.
          tap-token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Generate the formula without publishing it (tap skipped)
        # Prereleases: no tap token in this step; the tap stage logs why it
        # skips. The release is already published, so a failure here must
        # not turn the run red.
        if: steps.plan.outputs.tap == 'skip'
        continue-on-error: true
        uses: magicdrive/hephaestus@0f76752ad2a6598ba8fc6978eb90a790c71c4835 # v1.5.0
        with:
          command: run
          stages: formula,tap
          github-token: ""
