# kjak-notify-macos is released with Hephaestus (v1.5.0). The release
# workflow (.github/workflows/release.yml) runs every stage on a v* tag after
# CI passes; `make snapshot` runs build, archive and checksum locally.
# hephaestus.rehearsal.yaml must stay identical to this file except for the
# lines it names (release_test.go).
version: 1

project:
  name: kjak-notify-macos
  description: Experimental macOS notification plugin for kjak
  homepage: https://github.com/magicdrive/kjak-notify-macos
  license: MIT

builds:
  - id: kjak-feather-notify-macos
    # macOS only: the plugin runs terminal-notifier, which exists only there.
    matrix:
      os: [darwin]
      arch: [amd64, arm64]
    command:
      - go
      - build
      - -trimpath
      - -ldflags
      - "-s -w"
      - -o
      - "dist/bin/{{ .OS }}_{{ .Arch }}/kjak-feather-notify-macos"
      - ./cmd/kjak-feather-notify-macos
    env:
      GOOS: "{{ .OS }}"
      GOARCH: "{{ .Arch }}"
      CGO_ENABLED: "0"
    output: "dist/bin/{{ .OS }}_{{ .Arch }}/kjak-feather-notify-macos"

archives:
  - id: kjak-notify-macos
    name: "{{ .Project }}_{{ .Version }}_{{ .OS }}_{{ .Arch }}"
    format: tar.gz
    files:
      # kjak finds plugin notify-macos as kjak-feather-notify-macos on PATH.
      - src: "dist/bin/{{ .OS }}_{{ .Arch }}/kjak-feather-notify-macos"
        dst: kjak-feather-notify-macos
        mode: "0755"
      - LICENSE
      - README.md

checksum:
  name: "{{ .Project }}_checksums.txt"

release:
  github:
    owner: magicdrive
    name: kjak-notify-macos
    # The notes of the version being released; update it before tagging.
    notes_file: RELEASE_NOTES.md

brews:
  - name: kjak-notify-macos
    ids: [kjak-notify-macos]
    description: Experimental macOS notification plugin for kjak
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    # magicdrive/homebrew-tap keeps its formulae at the repository root;
    # creating Formula/ there would hide them from Homebrew.
    # Prereleases (v0.1.0-rc.1) never update the tap.
    skip_upload: auto
    # os: mac puts it in on_macos: Hephaestus v1.5.0 writes a top-level
    # depends_on before its own depends_on :macos, an order brew audit
    # --strict refuses. The formula is macOS only, so it means the same.
    dependencies:
      - name: terminal-notifier
        os: mac
    install: |
      bin.install "kjak-feather-notify-macos"
    # Never posts a notification. The plugin finds and checks
    # terminal-notifier before it looks at the body, so a request with an
    # empty body proves that the dependency is found (named by the setting,
    # and on PATH) and accepted as terminal-notifier, then stops. Its opt bin is
    # under the Homebrew prefix: /opt/homebrew or /usr/local.
    test: |
      out = pipe_output(bin/"kjak-feather-notify-macos", '{"protocol_version":0}')
      assert_match '"protocol_version":1', out
      assert_match "unsupported protocol_version 0", out
      tn = formula_opt_bin("terminal-notifier")/"terminal-notifier"
      req = { protocol_version: 1, message: { body: "" }, settings: { terminal_notifier: tn.to_s } }
      out = pipe_output(bin/"kjak-feather-notify-macos", JSON.generate(req))
      assert_match "the message has no body to show", out
      with_env(PATH: "#{tn.dirname}:/usr/bin:/bin") do
        out = pipe_output(bin/"kjak-feather-notify-macos", '{"protocol_version":1,"message":{"body":""}}')
      end
      assert_match "the message has no body to show", out
    # Homebrew's bin, Cellar and opt are writable by group admin: kjak
    # v1.2.0 runs a plugin there only with its SHA-256 pinned
    # (scripts/homebrew-e2e.sh checks it).
    caveats: |
      kjak (v1.2.0 or later) runs this plugin only with its SHA-256 pinned:
      Homebrew's bin and Cellar can be written by the admin group, so kjak
      does not trust the place alone. `kjak feather plugins` shows the value
      to pin. In ~/.config/kjak/config.toml:
        [feathers.mac]
        type = "external"
        plugin = "notify-macos"
        sha256 = "<the sha256 kjak feather plugins shows>"
        settings = { terminal_notifier = "/opt/homebrew/bin/terminal-notifier" }
      Update sha256 after each `brew upgrade kjak-notify-macos`. On an Intel
      Mac, terminal-notifier is /usr/local/bin/terminal-notifier. kjak v1.1.0
      refuses a plugin installed by Homebrew. The pin covers this plugin
      only, not terminal-notifier (also in Homebrew's Cellar).
    repository:
      owner: magicdrive
      name: homebrew-tap
      pull_request:
        enabled: true

# Release safety checks before a tag is pushed: hephaestus preflight --tag vX.Y.Z
# (docs/release.md).
preflight:
  branch: main
  workflow: release.yml
  environment: release
  changelog: CHANGELOG.md
